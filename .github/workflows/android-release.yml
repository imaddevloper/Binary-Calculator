name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "artifacts/mobile/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/mobile/**/gradle-wrapper.properties', 'artifacts/mobile/**/build.gradle', 'artifacts/mobile/**/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile unit tests
        run: pnpm --filter @workspace/mobile run test:unit

      - name: Check mobile TypeScript
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Generate Android native project
        run: pnpm --filter @workspace/mobile exec expo prebuild --platform android --no-install

      - name: Build Release APK
        working-directory: artifacts/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --build-cache

      - name: Verify APK output
        id: apk
        shell: bash
        run: |
          APK_PATH="artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Release APK was not generated at $APK_PATH"
            find artifacts/mobile/android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Binary-Calculator-Release-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
